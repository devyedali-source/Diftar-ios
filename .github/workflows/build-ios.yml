name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile shared code
        run: |
          set -o pipefail
          mkdir -p ci
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace 2>&1 | tee ci/compile.log

      - name: Run shared-code tests on iOS Simulator
        if: contains(github.event.head_commit.message, '[tests]') || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          mkdir -p ci
          ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace 2>&1 | tee ci/tests.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app for iOS Simulator
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../ci/xcode.log

      - name: Run app in iOS Simulator and take screenshots
        if: success()
        continue-on-error: true
        run: |
          set -x
          mkdir -p ci/shots
          APP=$(find iosApp/build -name "DaftarAlMoallim.app" -type d | head -1)
          echo "APP=$APP"
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "DEVICE=$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b || true
          xcrun simctl install "$DEVICE" "$APP"
          export SIMCTL_CHILD_DAFTAR_SKIP_LOCK=1
          xcrun simctl launch --stdout=$PWD/ci/app-stdout.log --stderr=$PWD/ci/app-stderr.log "$DEVICE" com.elyedali.schoolmanager
          sleep 25
          xcrun simctl io "$DEVICE" screenshot ci/shots/01-login.png
          xcrun simctl terminate "$DEVICE" com.elyedali.schoolmanager || true
          export SIMCTL_CHILD_DAFTAR_CI_DEMO=1
          xcrun simctl launch --stdout=$PWD/ci/app-stdout2.log --stderr=$PWD/ci/app-stderr2.log "$DEVICE" com.elyedali.schoolmanager
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ci/shots/02-main.png
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ci/shots/03-main-later.png
          xcrun simctl terminate "$DEVICE" com.elyedali.schoolmanager || true
          export SIMCTL_CHILD_DAFTAR_CI_E2E=1
          xcrun simctl launch --stdout=$PWD/ci/app-stdout3.log --stderr=$PWD/ci/app-stderr3.log "$DEVICE" com.elyedali.schoolmanager
          C=$(xcrun simctl get_app_container "$DEVICE" com.elyedali.schoolmanager data)
          LAST=""
          for i in $(seq 1 600); do
            S=$(cat "$C/Documents/ci_step.txt" 2>/dev/null || echo "")
            if [ -n "$S" ] && [ "$S" != "$LAST" ]; then
              LAST="$S"
              [ "$S" = "done" ] && break
              sleep 1
              xcrun simctl io "$DEVICE" screenshot "ci/shots/step-$S.png"
            fi
            if [ -f "$C/Documents/ci_error.txt" ]; then break; fi
            sleep 1
          done
          xcrun simctl io "$DEVICE" screenshot ci/shots/04-e2e.png
          ls -la "$C/Documents" || true
          cp "$C"/Documents/ci_* ci/ 2>/dev/null || true
          for f in ci/*.pdf; do [ -f "$f" ] && sips -s format png "$f" --out "ci/shots/$(basename "$f" .pdf)-p1.png" || true; done
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i daftar > ci/app-running.txt || echo "NOT RUNNING" > ci/app-running.txt
          find ~/Library/Logs/DiagnosticReports -name "*DaftarAlMoallim*" -newer iosApp/project.yml -exec cp {} ci/ \; 2>/dev/null || true

      # تقرير البناء يُحفظ في فرع ci-results لقراءته دون الحاجة إلى صفحة Actions
      - name: Publish build report
        if: always()
        run: |
          mkdir -p ci
          grep -hE '^(e|w): ' ci/*.log | grep -E '^e: ' > ci/errors.txt || true
          grep -hE '^w: ' ci/*.log | head -300 > ci/warnings.txt || true
          grep -hE 'error:' ci/xcode.log > ci/xcode-errors.txt 2>/dev/null || true
          cp -r composeApp/build/test-results ci/test-results 2>/dev/null || true
          for f in ci/*.log; do [ -f "$f" ] && tail -c 60000 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          echo "commit=${GITHUB_SHA} status=${{ job.status }} run=${GITHUB_RUN_ID}" > ci/summary.txt
          cd ci
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b ci-results
          git add -A
          git commit -q -m "report ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
