name: Fetch fonts

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/fetch-fonts.yml' ]

permissions:
  contents: write

jobs:
  fonts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download Noto Sans Arabic (font used by Android WebView for the reports)
        run: |
          set -x
          mkdir -p out
          curl -fsSL -o out/NotoSansArabic-VF.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf"
          ls -la out
      - name: Commit fonts
        run: |
          mkdir -p fonts-download
          cp out/* fonts-download/ || true
          ls -la fonts-download
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fonts-download
          git commit -m "fonts: download Android system fonts [skip ci]" || echo "nothing"
          git pull --rebase origin main || true
          git push origin HEAD:main

# v2
