name: iosApp
options:
  bundleIdPrefix: com.elyedali
  deploymentTarget:
    iOS: "15.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: "دفتر المعلم"
        NSFaceIDUsageDescription: "يستعمل التطبيق بصمة الوجه لحماية بيانات الطلاب ودرجاتهم"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: activation
            CFBundleURLSchemes:
              - daftarmeallim
        LSApplicationQueriesSchemes:
          - whatsapp
          - tg
          - fb
          - mailto
        CFBundleShortVersionString: "0.0.0.26"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ar
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: DaftarAlMoallim
        PRODUCT_BUNDLE_IDENTIFIER: com.elyedali.schoolmanager
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
